[package]
name = "openrode"
authors = ["Eepin"]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
] }
futures = "0.3"
anyhow = "1"
async-trait = "0.1"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
hillm = { path = "crates/hillm" }

[workspace]
resolver = "3"
members = ["crates/hillm"]

[workspace.package]
authors = ["Eepin"]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
reqwest = { version = "0.13.4", features = ["stream", "json"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
futures = "0.3"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
