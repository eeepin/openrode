[package]
name = "openrode"
authors = ["Eepin"]
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
dotenv = "0.15.0"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt-multi-thread",
    "process",
] }
hillm = { path = "crates/hillm" }

[workspace]
resolver = "3"
members = ["crates/hillm"]

[workspace.package]
authors = ["Eepin"]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
