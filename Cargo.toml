[package]
name = "openrode"
authors = ["Eepin"]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[dependencies]
clap = { version = "4.6.1", features = ["derive", "env"] }
dotenv = "0.15.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
] }
futures = "0.3"
anyhow = "1"
async-trait = "0.1"
ulid = { version = "1", features = ["serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
tempfile = "3"
git2 = "0.19"
hillm = { path = "crates/hillm" }

# L7: Server dependencies (using hyper directly to avoid axum dependency issues)
hyper = { version = "1.0", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "http1", "http2"] }
http-body = "1.0"
http-body-util = "0.1"
bytes = "1.0"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# L8: TUI dependencies
ratatui = "0.29"
crossterm = "0.28"
reqwest = { version = "0.12", features = ["stream", "json"] }

# L9: Skill dependencies
serde_yaml = "0.9"

# L9: Plugin dependencies
libloading = "0.8"
wasmtime = "27"

[workspace]
resolver = "3"
members = ["crates/hillm"]

[workspace.package]
authors = ["Eepin"]
version = "0.1.0"
edition = "2024"


[workspace.dependencies]
reqwest = { version = "0.13.4", features = ["stream", "json"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
futures = "0.3"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread"] }
